document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 auto; padding: 40px 32px 72px; display: flex; flex-direction: column; gap: 26px;\">\n\n      <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n        <div style=\"font-weight: 700; font-size: 28px;\">Add photos<\u002Fdiv>\n        <div style=\"font-size: 15px; color: #43536E; line-height: 1.6;\">Upload photos or plans of the building in any order.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- dropzone -->\n      <div sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drag-leave=\"{{ onDragLeave }}\" sc-camel-on-drop=\"{{ onDrop }}\" style=\"{{ dropzoneStyle }}\">\n        <div style=\"font-weight: 600; font-size: 16px;\">Drag photos here<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #6B7A93;\">or<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ chooseFiles }}\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 14px; color: #2563EB; background: #FFFFFF; border: 1px solid #D5DEEA; border-radius: 12px; padding: 11px 22px; cursor: pointer;\" style-hover=\"border-color: #2563EB;\">Upload photos<\u002Fbutton>\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #98A4B8; margin-top: 4px;\">JPG, PNG, HEIC, PDF · up to 25 MB each<\u002Fdiv>\n        <input type=\"file\" accept=\"image/*\" multiple=\"\" ref=\"{{ fileInputRef }}\" sc-camel-on-change=\"{{ onFilesPicked }}\" style=\"display: none;\">\n      <\u002Fdiv>\n\n      <!-- plain thumbnail grid -->\n      <sc-if value=\"{{ hasPhotos }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-wrap: wrap; gap: 14px;\">\n          <sc-for list=\"{{ thumbs }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <div style=\"{{ t.style }}\">\n              <div sc-camel-on-click=\"{{ t.onRemove }}\" style=\"position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF; border: 1px solid #D5DEEA; color: #43536E; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 6px rgba(20,30,50,0.12);\" style-hover=\"color: #B91C1C; border-color: #B91C1C;\">✕<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- measurement quality -->\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #6B7A93;\">Measurement quality<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 0; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 14px; overflow: hidden;\">\n          <button sc-camel-on-click=\"{{ qualityStd }}\" style=\"{{ qStdStyle }}\">\n            <span style=\"{{ qStdTitle }}\">Standard<\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #6B7A93; line-height: 1.45;\">Good accuracy, lower cost per measurement<\u002Fspan>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ qualityPrm }}\" style=\"{{ qPrmStyle }}\">\n            <span style=\"{{ qPrmTitle }}\">Premium<\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #6B7A93; line-height: 1.45;\">Highest accuracy, uses more of your quota<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- reference measurement -->\n      <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n        <div style=\"font-size: 14px; font-weight: 600; color: #43536E;\">Add a reference measurement <span style=\"font-weight: 500; color: #98A4B8;\">(optional)<\u002Fspan><\u002Fdiv>\n        <input placeholder=\"e.g. garage door · 16' 0&quot;\" style=\"max-width: 340px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #16233A; background: #FFFFFF; border: 1px solid #E3E8EF; border-radius: 12px; padding: 13px 16px; outline: none;\" style-focus=\"border-color: #2563EB;\">\n      <\u002Fdiv>\n\n      <div>\n        <button sc-camel-on-click=\"{{ startMeasurement }}\" style=\"{{ startBtnStyle }}\">Start measurement<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- PROBLEM MODAL -->\n    <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position: fixed; inset: 0; background: rgba(22,35,58,0.50); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 32px;\">\n        <div style=\"width: 520px; max-width: 100%; background: #FFFFFF; border-radius: 20px; box-shadow: 0 24px 64px rgba(20,30,50,0.35); padding: 32px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 5px;\">\n            <div style=\"font-weight: 700; font-size: 21px;\">{{ modalTitle }}<\u002Fdiv>\n            <div style=\"font-size: 14px; color: #43536E; line-height: 1.5;\">The rest of your photos are fine — replace these and start again.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <sc-for list=\"{{ badPhotos }}\" as=\"b\" hint-placeholder-count=\"2\">\n              <div style=\"display: flex; gap: 14px; align-items: center; background: #FBE9E9; border: 1px solid #F2C4C4; border-radius: 14px; padding: 12px;\">\n                <div style=\"width: 68px; height: 68px; border-radius: 10px; flex-shrink: 0; background: repeating-linear-gradient(45deg, #F2E2E2, #F2E2E2 8px, #EBD3D3 8px, #EBD3D3 16px); border: 1px solid #E8BDBD;\"><\u002Fdiv>\n                <div style=\"font-size: 14px; color: #7A1F1F; line-height: 1.5; font-weight: 500;\">{{ b.reason }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ removeBad }}\" style=\"font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px; color: #FFFFFF; background: #2563EB; border: none; border-radius: 12px; padding: 14px 0; cursor: pointer; box-shadow: 0 2px 8px rgba(37,99,235,0.25);\" style-hover=\"filter: brightness(1.08);\">Remove &amp; upload new<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  <!-- LOADING VIEW -->\n  <sc-if value=\"{{ viewLoading }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; background: #14181F; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;\">\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #7D8AA0;\">Reconstructing<\u002Fdiv>\n      <div style=\"font-weight: 600; font-size: 24px; color: #F2F5F9;\">Building your 3D model…<\u002Fdiv>\n      <div style=\"width: 280px; height: 3px; border-radius: 999px; background: #2A3140; overflow: hidden;\">\n        <div style=\"height: 100%; border-radius: 999px; background: #2563EB; animation: loadbar 2.4s ease-out forwards;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7D8AA0;\">1428 Maple St, Columbus, OH<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- MODEL VIEW -->\n  <sc-if value=\"{{ viewModel }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; background: #FFFFFF; z-index: 40;\">\n      <div ref=\"{{ mountRef }}\" style=\"position: absolute; inset: 0; cursor: grab;\"><\u002Fdiv>\n      <div style=\"position: absolute; top: 20px; left: 24px; display: flex; align-items: center; gap: 12px;\">\n        <div sc-camel-on-click=\"{{ backToUpload }}\" style=\"width: 36px; height: 36px; border-radius: 999px; background: rgba(255,255,255,0.94); border: 1px solid #E3E8EF; display: flex; align-items: center; justify-content: center; color: #43536E; font-size: 15px; cursor: pointer; box-shadow: 0 3px 10px rgba(20,30,50,0.10);\">←<\u002Fdiv>\n        <div style=\"background: rgba(255,255,255,0.94); border: 1px solid #E3E8EF; border-radius: 999px; padding: 8px 16px; box-shadow: 0 3px 10px rgba(20,30,50,0.10); display: flex; align-items: center; gap: 10px;\">\n          <div style=\"font-weight: 600; font-size: 14px;\">Hendricks Residence<\u002Fdiv>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 500; color: #157F3D; background: #E7F6EC; border-radius: 999px; padding: 3px 9px;\">Model ready<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #93A1B5; background: rgba(255,255,255,0.9); border: 1px solid #E5EAF1; border-radius: 999px; padding: 5px 14px; white-space: nowrap;\">drag to rotate · scroll to zoom<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1100, &quot;height&quot;: 900 }\n}\">\nclass Component extends DCLogic {\n  state = {\n    set: 'A',\n    photos: [{ id: 'u1' }, { id: 'u2' }, { id: 'u3' }, { id: 'u4' }, { id: 'u5' }],\n    view: 'upload', modal: false, dragOver: false, quality: 'standard',\n  };\n  fileInputRef = React.createRef();\n  mountRef = React.createRef();\n\n  photosFor(set) {\n    if (set === 'B') return [\n      { id: 'u1' }, { id: 'u2' },\n      { id: 'b1', bad: true, reason: 'Too blurry to detect edges.' },\n      { id: 'u3' },\n      { id: 'b2', bad: true, reason: 'The building is mostly hidden behind trees.' },\n    ];\n    return [{ id: 'u1' }, { id: 'u2' }, { id: 'u3' }, { id: 'u4' }, { id: 'u5' }];\n  }\n\n  addFiles(files) {\n    const photos = [...this.state.photos];\n    Array.from(files).forEach((f, i) => {\n      if (!f.type || f.type.startsWith('image/')) {\n        photos.push({ id: 'f' + Date.now() + i, url: URL.createObjectURL(f) });\n      }\n    });\n    this.setState({ photos, dragOver: false });\n  }\n\n  // ---------- three.js model view ----------\n\n  componentWillUnmount() {\n    clearTimeout(this.loadTimer);\n    cancelAnimationFrame(this.raf);\n    if (this.ro) this.ro.disconnect();\n    if (this.renderer) this.renderer.dispose();\n  }\n\n  componentDidUpdate() {\n    if (this.state.view === 'model' && this.mountRef.current && !this.renderer && window.THREE) {\n      this.initScene();\n    }\n    if (this.state.view !== 'model' && this.renderer) {\n      this.disposeScene();\n    }\n  }\n\n  buildHouse(scene) {\n    const THREE = window.THREE;\n    const mat = (hex) => new THREE.MeshStandardMaterial({ color: hex, roughness: 0.92, metalness: 0 });\n    const addPart = (geom, pos, rot, baseColor) => {\n      const mesh = new THREE.Mesh(geom, mat(baseColor));\n      mesh.position.set(...pos);\n      if (rot) mesh.rotation.set(...rot);\n      mesh.castShadow = true;\n      const edge = new THREE.LineSegments(new THREE.EdgesGeometry(geom, 25), new THREE.LineBasicMaterial({ color: 0xb9c4d3 }));\n      edge.position.copy(mesh.position);\n      edge.rotation.copy(mesh.rotation);\n      scene.add(mesh); scene.add(edge);\n    };\n\n    const WALL = '#F3F6FA', WALL2 = '#EDF1F7', ROOF = '#DDE4ED', DECOR = '#D7DEE8';\n    addPart(new THREE.BoxGeometry(8, 3, 0.16), [0, 1.5, 3], null, WALL);\n    addPart(new THREE.BoxGeometry(8, 3, 0.16), [0, 1.5, -3], null, WALL2);\n    addPart(new THREE.BoxGeometry(0.16, 3, 6), [4, 1.5, 0], null, WALL2);\n    addPart(new THREE.BoxGeometry(0.16, 3, 6), [-4, 1.5, 0], null, WALL);\n\n    const gableShape = new THREE.Shape();\n    gableShape.moveTo(-4, 3); gableShape.lineTo(4, 3); gableShape.lineTo(0, 5); gableShape.closePath();\n    const gableGeom = new THREE.ExtrudeGeometry(gableShape, { depth: 0.16, bevelEnabled: false });\n    addPart(gableGeom, [0, 0, 2.92], null, WALL);\n    addPart(gableGeom, [0, 0, -3.08], null, WALL);\n\n    const a = Math.atan2(2, 4);\n    const slope = Math.sqrt(4.3 * 4.3 + 2.15 * 2.15);\n    addPart(new THREE.BoxGeometry(slope, 0.14, 6.9), [2.15, 3.985, 0], [0, 0, -a], ROOF);\n    addPart(new THREE.BoxGeometry(slope, 0.14, 6.9), [-2.15, 3.985, 0], [0, 0, a], ROOF);\n\n    addPart(new THREE.BoxGeometry(1.1, 2.2, 0.12), [1.4, 1.1, 3.12], null, DECOR);\n    addPart(new THREE.BoxGeometry(1.3, 1.25, 0.12), [-1.7, 1.75, 3.12], null, DECOR);\n    addPart(new THREE.BoxGeometry(0.12, 1.15, 1.35), [4.1, 1.75, -1.4], null, DECOR);\n  }\n\n  initScene() {\n    const THREE = window.THREE;\n    const mount = this.mountRef.current;\n    const scene = new THREE.Scene();\n    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);\n    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });\n    renderer.setClearColor(0x000000, 0);\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n    renderer.shadowMap.enabled = true;\n    renderer.shadowMap.type = THREE.VSMShadowMap;\n    renderer.domElement.style.width = '100%';\n    renderer.domElement.style.height = '100%';\n    renderer.domElement.style.display = 'block';\n    renderer.domElement.style.touchAction = 'none';\n    mount.appendChild(renderer.domElement);\n\n    scene.add(new THREE.HemisphereLight(0xffffff, 0xdde4ee, 1.1));\n    const dir = new THREE.DirectionalLight(0xffffff, 1.6);\n    dir.position.set(9, 16, 7);\n    dir.castShadow = true;\n    dir.shadow.mapSize.set(2048, 2048);\n    dir.shadow.camera.left = -14; dir.shadow.camera.right = 14;\n    dir.shadow.camera.top = 14; dir.shadow.camera.bottom = -14;\n    dir.shadow.camera.far = 60;\n    dir.shadow.radius = 7;\n    dir.shadow.blurSamples = 16;\n    dir.shadow.bias = -0.0002;\n    scene.add(dir);\n\n    const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.ShadowMaterial({ opacity: 0.14 }));\n    floor.rotation.x = -Math.PI / 2;\n    floor.receiveShadow = true;\n    scene.add(floor);\n\n    this.buildHouse(scene);\n\n    const sph = { theta: -0.65, phi: 1.1, r: 20 };\n    const target = new THREE.Vector3(0, 1.7, 0);\n    this.scene = scene; this.camera = camera; this.renderer = renderer; this.sph = sph;\n\n    const el = renderer.domElement;\n    let dragging = false, lastX = 0, lastY = 0;\n    el.addEventListener('pointerdown', (e) => {\n      dragging = true; lastX = e.clientX; lastY = e.clientY;\n      el.setPointerCapture(e.pointerId);\n    });\n    el.addEventListener('pointermove', (e) => {\n      if (!dragging) return;\n      const dx = e.clientX - lastX, dy = e.clientY - lastY;\n      lastX = e.clientX; lastY = e.clientY;\n      sph.theta -= dx * 0.006;\n      sph.phi = Math.min(1.45, Math.max(0.25, sph.phi - dy * 0.005));\n    });\n    el.addEventListener('pointerup', () => { dragging = false; });\n    el.addEventListener('wheel', (e) => {\n      e.preventDefault();\n      sph.r = Math.min(40, Math.max(10, sph.r * (1 + e.deltaY * 0.001)));\n    }, { passive: false });\n\n    const resize = () => {\n      const w = mount.clientWidth, h = mount.clientHeight;\n      if (!w || !h) return;\n      renderer.setSize(w, h, false);\n      camera.aspect = w / h;\n      camera.updateProjectionMatrix();\n    };\n    this.ro = new ResizeObserver(resize);\n    this.ro.observe(mount);\n    resize();\n\n    const loop = () => {\n      this.raf = requestAnimationFrame(loop);\n      camera.position.setFromSphericalCoords(sph.r, sph.phi, sph.theta).add(target);\n      camera.lookAt(target);\n      renderer.render(scene, camera);\n    };\n    loop();\n  }\n\n  disposeScene() {\n    cancelAnimationFrame(this.raf);\n    if (this.ro) { this.ro.disconnect(); this.ro = null; }\n    if (this.renderer) {\n      if (this.renderer.domElement.parentNode) this.renderer.domElement.parentNode.removeChild(this.renderer.domElement);\n      this.renderer.dispose();\n      this.renderer = null; this.scene = null; this.camera = null;\n    }\n  }\n\n  // ---------- render ----------\n\n  renderVals() {\n    const accent = '#2563EB';\n    const { set, photos, view, modal, dragOver } = this.state;\n\n    const demoTabs = [\n      { key: 'A', label: 'A · Photos ok' },\n      { key: 'B', label: 'B · Not usable' },\n    ].map((d) => ({\n      label: d.label,\n      onSelect: () => this.setState({ set: d.key, photos: this.photosFor(d.key), view: 'upload', modal: false }),\n      style: {\n        fontFamily: \"'IBM Plex Sans', sans-serif\", fontWeight: 600, fontSize: '13px',\n        border: 'none', borderRadius: '999px', padding: '8px 16px', cursor: 'pointer',\n        background: set === d.key ? accent : 'transparent',\n        color: set === d.key ? '#FFFFFF' : '#6B7A93',\n        transition: 'background 0.15s ease, color 0.15s ease',\n      },\n    }));\n\n    const stripe = 'repeating-linear-gradient(45deg, #EFF2F6, #EFF2F6 8px, #E4E9F0 8px, #E4E9F0 16px)';\n    const thumbs = photos.map((p) => ({\n      onRemove: () => this.setState((s) => ({ photos: s.photos.filter((x) => x.id !== p.id) })),\n      style: {\n        position: 'relative', width: '108px', height: '108px', borderRadius: '14px',\n        background: p.url ? ('url(' + p.url + ') center/cover') : stripe,\n        border: '1px solid #E3E8EF',\n        boxShadow: '0 3px 10px rgba(20,30,50,0.06)',\n      },\n    }));\n\n    const bad = photos.filter((p) => p.bad);\n    const canStart = photos.length > 0;\n\n    const quality = this.state.quality;\n    const qSeg = (active, first) => ({\n      display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: '3px',\n      textAlign: 'left', padding: '14px 18px', minHeight: '44px', cursor: 'pointer',\n      background: active ? 'rgba(37,99,235,0.06)' : '#FFFFFF',\n      border: 'none',\n      borderLeft: first ? 'none' : '1px solid #E3E8EF',\n      boxShadow: active ? ('inset 0 0 0 1.5px ' + accent) : 'none',\n      transition: 'background 0.15s ease, box-shadow 0.15s ease',\n    });\n    const qTitle = (active) => ({\n      fontFamily: \"'IBM Plex Sans', sans-serif\", fontWeight: 600, fontSize: '14px',\n      color: active ? accent : '#16233A',\n    });\n\n    return {\n      demoTabs, thumbs,\n      hasPhotos: photos.length > 0,\n      viewUpload: view === 'upload',\n      viewLoading: view === 'loading',\n      viewModel: view === 'model',\n      modalOpen: modal,\n      badPhotos: bad.map((b) => ({ reason: b.reason })),\n      modalTitle: bad.length === 1 ? \"This photo can't be measured\" : \"These photos can't be measured\",\n      fileInputRef: this.fileInputRef,\n      mountRef: this.mountRef,\n      chooseFiles: () => this.fileInputRef.current && this.fileInputRef.current.click(),\n      onFilesPicked: (e) => this.addFiles(e.target.files),\n      onDragOver: (e) => { e.preventDefault(); if (!dragOver) this.setState({ dragOver: true }); },\n      onDragLeave: () => this.setState({ dragOver: false }),\n      onDrop: (e) => { e.preventDefault(); this.addFiles(e.dataTransfer.files); },\n      dropzoneStyle: {\n        display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px',\n        padding: '40px 24px', borderRadius: '18px',\n        border: '2px dashed ' + (dragOver ? accent : '#C9D4E2'),\n        background: dragOver ? 'rgba(37,99,235,0.05)' : '#FFFFFF',\n        transition: 'border-color 0.15s ease, background 0.15s ease',\n      },\n      qualityStd: () => this.setState({ quality: 'standard' }),\n      qualityPrm: () => this.setState({ quality: 'premium' }),\n      qStdStyle: qSeg(quality === 'standard', true),\n      qPrmStyle: qSeg(quality === 'premium', false),\n      qStdTitle: qTitle(quality === 'standard'),\n      qPrmTitle: qTitle(quality === 'premium'),\n      startMeasurement: () => {\n        if (!canStart) return;\n        if (bad.length > 0) { this.setState({ modal: true }); return; }\n        this.setState({ view: 'loading' });\n        clearTimeout(this.loadTimer);\n        this.loadTimer = setTimeout(() => this.setState({ view: 'model' }), 2500);\n      },\n      removeBad: () => this.setState((s) => ({ photos: s.photos.filter((p) => !p.bad), modal: false })),\n      backToUpload: () => this.setState({ view: 'upload' }),\n      startBtnStyle: {\n        fontFamily: \"'IBM Plex Sans', sans-serif\", fontWeight: 600, fontSize: '15px',\n        color: '#FFFFFF', background: canStart ? accent : '#A9B6C9',\n        border: 'none', borderRadius: '12px', padding: '14px 32px',\n        cursor: canStart ? 'pointer' : 'not-allowed',\n        boxShadow: canStart ? '0 2px 8px rgba(37,99,235,0.25)' : 'none',\n        transition: 'background 0.15s ease',\n      },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
